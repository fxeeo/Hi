{% extends "base.html" %}

{% block title %}Donate{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <h2>Contribute to Relief Operations</h2>
    <p>This is a prototype. No real money is processed.</p>

    {% if success %}
        <p class="success">Thank you, {{ name }}, for your generous pledge of ₹{{ amount }}!</p>
    {% else %}
    <form method="POST" action="{{ url_for('donate_page') }}">
        <label for="name">Donor Name</label>
        <input type="text" id="name" name="name" required>

        <label for="amount">Donation Amount (₹)</label>
        <input type="number" id="amount" name="amount" required min="1">

        <button type="button" onclick="document.getElementById('amount').value=500" style="margin-top: 0.5rem; background: #e0f2fe; color: #0056b3;">Quick: ₹500</button>
        <button type="button" onclick="document.getElementById('amount').value=1000" style="margin-top: 0.5rem; background: #e0f2fe; color: #0056b3;">Quick: ₹1000</button>

        <button type="submit" style="margin-top: 1rem;">Donate Now</button>
    </form>
    {% endif %}
</div>
{% endblock %}
