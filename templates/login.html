{% extends "base.html" %}

{% block title %}Login - Assam Flood PDP{% endblock %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 0 auto;">
    <h2>Authorized Login</h2>
    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}
    <form method="POST" action="{{ url_for('login_page') }}">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="admin@assamflood.local">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="admin123">

        <button type="submit">Login</button>
    </form>
</div>
{% endblock %}
